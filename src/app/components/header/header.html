<header class="header-root">
  <div class="header-bar">
    <a class="brand" href="#home" (click)="scrollTo('home', $event)">Nahuel Alderete</a>

    <nav class="nav-links" aria-label="Navegación principal" i18n-aria-label>
      <a href="#about-me" (click)="scrollTo('about-me', $event)" [class.active-link]="activeSection() === 'about-me'"
        [attr.aria-current]="activeSection() === 'about-me' ? 'location' : null" i18n="@@navAbout">Sobre mí</a>
      <a href="#resume" (click)="scrollTo('resume', $event)" [class.active-link]="activeSection() === 'resume'"
        [attr.aria-current]="activeSection() === 'resume' ? 'location' : null" i18n="@@navResume">Experiencia</a>
      <a href="#contact-me" (click)="scrollTo('contact-me', $event)" [class.active-link]="activeSection() === 'contact-me'"
        [attr.aria-current]="activeSection() === 'contact-me' ? 'location' : null" i18n="@@navContact">Contacto</a>

      <button type="button" class="lang-btn" (click)="switchLocale()"
        [attr.aria-label]="currentLocale === 'es-AR' ? 'Switch to English' : 'Cambiar a Español'">
        {{ currentLocale === 'es-AR' ? 'EN' : 'ES' }}
      </button>
    </nav>

    <button class="btn-menu-mobile" mat-icon-button (click)="toggleMobileMenu()"
      [attr.aria-expanded]="isMobileMenuOpen()" aria-controls="mobile-menu"
      aria-label="Abrir menú de navegación" i18n-aria-label>
      <mat-icon>{{ isMobileMenuOpen() ? 'close' : 'menu' }}</mat-icon>
    </button>
  </div>
</header>

<!-- Fuera de .header-root: su z-index crea un contexto de apilamiento que dejaría
     al drawer por debajo del widget del chatbot -->
<nav id="mobile-menu" class="mobile-menu" [class.show]="isMobileMenuOpen()" [attr.inert]="isMobileMenuOpen() ? null : ''"
  aria-label="Menú móvil" i18n-aria-label>
  <div class="mobile-menu-header">
    <span class="brand">Nahuel Alderete</span>
    <button mat-icon-button (click)="closeMobileMenu()" aria-label="Cerrar menú" i18n-aria-label>
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="mobile-menu-content">
    <a href="#home" (click)="scrollTo('home', $event); closeMobileMenu()" [class.active-link]="activeSection() === 'home'"
      i18n="@@navHome">Inicio</a>
    <a href="#about-me" (click)="scrollTo('about-me', $event); closeMobileMenu()" [class.active-link]="activeSection() === 'about-me'"
      i18n="@@navAbout">Sobre mí</a>
    <a href="#resume" (click)="scrollTo('resume', $event); closeMobileMenu()" [class.active-link]="activeSection() === 'resume'"
      i18n="@@navResume">Experiencia</a>
    <a href="#contact-me" (click)="scrollTo('contact-me', $event); closeMobileMenu()" [class.active-link]="activeSection() === 'contact-me'"
      i18n="@@navContact">Contacto</a>

    <div class="mobile-lang-wrapper">
      <button mat-stroked-button class="mobile-lang-toggle" (click)="switchLocale()">
        {{ currentLocale === 'es-AR' ? 'English version' : 'Versión en español' }}
      </button>
    </div>
  </div>
</nav>

<div class="mobile-menu-overlay" (click)="closeMobileMenu()" [class.show]="isMobileMenuOpen()" aria-hidden="true"></div>
