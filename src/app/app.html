<a class="skip-link" href="#home" i18n>Saltar al contenido</a>

<app-header></app-header>
<main>
  <section id="home">
    <app-home></app-home>
  </section>

  <!-- About Me section, render immediately in tests -->
  <section id="about-me">
    @if (isTest) {
    <app-about-me></app-about-me>
    } @else { @defer (on viewport; on idle) {
    <app-about-me></app-about-me>
    } @placeholder {
    <div style="min-height: 50vh"></div>
    } }
  </section>

  <!-- Resume section -->
  <section id="resume">
    @if (isTest) {
    <app-resume></app-resume>
    } @else { @defer (on viewport; on idle) {
    <app-resume></app-resume>
    } @placeholder {
    <div style="min-height: 50vh"></div>
    } }
  </section>

  <!-- Contact Me section -->
  <section id="contact-me">
    @if (isTest) {
    <app-contact-me></app-contact-me>
    } @else { @defer (on viewport; on idle) {
    <app-contact-me></app-contact-me>
    } @placeholder {
    <div style="min-height: 50vh"></div>
    } }
  </section>
</main>
<app-footer></app-footer>
