<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=block" rel="stylesheet">
<style>
  :root {
    --bg: #0e0f11;
    --border: #26292e;
    --border-strong: #3a3e45;
    --text: #ececef;
    --muted: #a1a1aa;
    --subtle: #8a8a93;
    --accent: #7aa2f7;
    --success: #4ade80;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; background: var(--bg); }
  body {
    font-family: "IBM Plex Sans", sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    padding: 72px 88px 64px;
    display: flex;
    flex-direction: column;
  }
  .top {
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 22px;
    color: var(--muted);
  }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--success); }
  .name {
    margin-top: 72px;
    font-size: 34px;
    color: var(--muted);
  }
  h1 {
    margin-top: 14px;
    font-size: 84px;
    font-weight: 600;
    line-height: 1.02;
    letter-spacing: -0.035em;
  }
  h1 .amp { color: var(--accent); }
  .tags {
    margin-top: auto;
    display: flex;
    gap: 12px;
  }
  .tag {
    padding: 8px 16px;
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 21px;
    color: var(--muted);
  }
</style>
</head>
<body>
  <div class="top"><span class="dot"></span>nahuel.app</div>
  <p class="name">Nahuel Alderete</p>
  <h1>AI Engineer <span class="amp">&amp;</span><br>Full‑Stack Developer</h1>
  <div class="tags">
    <span class="tag">LLMs</span>
    <span class="tag">RAG</span>
    <span class="tag">Semantic Kernel</span>
    <span class="tag">.NET</span>
    <span class="tag">Angular</span>
    <span class="tag">Node.js</span>
  </div>
</body>
</html>
