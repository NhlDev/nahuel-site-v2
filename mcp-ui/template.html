<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  :root {
    --bg: var(--color-background-primary, #ffffff);
    --bg-soft: var(--color-background-secondary, #f1f5f9);
    --text: var(--color-text-primary, #0f172a);
    --text-soft: var(--color-text-secondary, #475569);
    --border: var(--color-border-primary, #e2e8f0);
    --accent: var(--color-text-info, #2563eb);
    --font: var(--font-sans, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif);
  }
  :root[data-theme='dark'] {
    --bg: var(--color-background-primary, #1e293b);
    --bg-soft: var(--color-background-secondary, #0f172a);
    --text: var(--color-text-primary, #e2e8f0);
    --text-soft: var(--color-text-secondary, #94a3b8);
    --border: var(--color-border-primary, #334155);
    --accent: var(--color-text-info, #93c5fd);
  }
  html { background: transparent; }
  body { margin: 0; display: flow-root; background: transparent; color: var(--text); font: 13px/1.45 var(--font); }
  main { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin: 2px; }
  h1 { font-size: 14px; margin: 0 0 10px; }
  h2 { font-size: 13px; margin: 0; }
  p { margin: 4px 0; }
  .muted { color: var(--text-soft); }
  .err { color: #b91c1c; font-size: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .chip, button { font: inherit; border: 1px solid var(--border); border-radius: 999px; background: var(--bg-soft); color: var(--text); padding: 3px 10px; }
  button { cursor: pointer; font-weight: 600; }
  button:disabled { opacity: 0.55; cursor: not-allowed; }
  button[aria-pressed='true'] { border-color: var(--accent); color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .chip.sm { padding: 0 8px; font-size: 11px; color: var(--text-soft); }
  .list { display: grid; gap: 8px; }
  .card { background: var(--bg-soft); border-radius: 8px; padding: 10px 12px; }
  .card header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .bar { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
  .track { position: relative; height: 6px; border-radius: 3px; background: var(--border); margin: 8px 0 2px; }
  .track i { position: absolute; top: 0; bottom: 0; border-radius: 3px; background: var(--accent); }
  ul { margin: 6px 0 0; padding-left: 18px; }
  a, .link { color: var(--accent); }
</style>
</head>
<body>
<main id="app"></main>
<script>/*BUNDLE*/</script>
</body>
</html>
